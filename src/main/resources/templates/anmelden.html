<!DOCTYPE html>
<html lang="de" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{teile :: kopf('Anmelden')}"></head>
<body>
<header th:replace="~{teile :: navigation}"></header>
<main id="inhalt">
    <div th:replace="~{teile :: nachrichten}"></div>
    <h1>Anmelden</h1>
    <p>Zum Übernehmen und Abschließen einer Bergung brauchst du ein Konto.</p>
    <p class="fehler" th:if="${param.error}" role="alert">Die Anmeldung hat nicht geklappt. Bitte prüfe Benutzername und Passwort.</p>
    <form th:action="@{/anmelden}" method="post" class="eingabeformular">
        <label for="username">Benutzername</label>
        <input id="username" name="username" autocomplete="username" required>
        <label for="password">Passwort</label>
        <input id="password" name="password" type="password" autocomplete="current-password" required>
        <button type="submit">Anmelden</button>
    </form>
    <p>Noch kein Konto? <a th:href="@{/registrieren}">Konto für Bergungen anlegen</a></p>
</main>
<footer th:replace="~{teile :: fuss}"></footer>
</body>
</html>
